# Lint, conventional-commit subjects and unit tests on every PR, in the merge queue,
# and after each merge to development or main. Mirrors the Makefile (`make lint`, `make test`).
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main, development]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make lint

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gates.py range needs both endpoints in history
      - name: Conventional commit subjects
        run: >-
          python3 ci/gates.py range
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: sigstore/cosign-installer@v4.1.2   # cosign 3: the signing tests use real keypairs
      - run: uv sync --frozen
      - run: make test

  # Drift ratchet: new hand-wiring fails; .ratchet.json only shrinks (checked against the base
  # branch's). traust-core is pulled in for this job only; the ledger doesn't depend on it.
  ratchet:
    runs-on: ubuntu-latest
    env:
      RATCHET: traust-core @ git+https://github.com/traust-security/traust-core@e0b2ddd98ca878cd4da478d98601415d9a8018c0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: |
          BASE="${{ github.base_ref || 'development' }}"
          git fetch --depth=1 origin "$BASE"
          REF=""
          if git show "origin/$BASE:.ratchet.json" > /tmp/ratchet-reference.json 2>/dev/null; then
            REF="--reference /tmp/ratchet-reference.json"
          fi
          uvx --from "$RATCHET" python -m traust_core.v1.checks.ratchet src --baseline .ratchet.json $REF
