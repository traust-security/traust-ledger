openapi: 3.1.0
info:
  title: Ledger-as-a-Service
  version: 0.1.0
paths:
  /healthz:
    get:
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/ledger/events:
    post:
      summary: Post Event
      operationId: post_event_v1_ledger_events_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: 'Validation error: missing fields, short rationale, future
            timestamp, two-person violation, machine on human lane, or unverified
            identity'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /v1/ledger/layers/{layer_id}/resolve:
    post:
      summary: Resolve Review
      operationId: resolve_review_v1_ledger_layers__layer_id__resolve_post
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolveResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer or review item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Invalid key, decision, or resolution rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /v1/ledger/layers/{layer_id}/initialize:
    post:
      summary: Post Initialize Layer
      operationId: post_initialize_layer_v1_ledger_layers__layer_id__initialize_post
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              title: Shell
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Post Initialize Layer V1 Ledger Layers  Layer Id  Initialize
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}:
    get:
      summary: Get Layer
      operationId: get_layer_v1_ledger_layers__layer_id__get
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Get Layer V1 Ledger Layers  Layer Id  Get
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/verify:
    get:
      summary: Verify Layer Endpoint
      operationId: verify_layer_endpoint_v1_ledger_layers__layer_id__verify_get
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      - name: check_signatures
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Check Signatures
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/findings:
    get:
      summary: Get Findings
      operationId: get_findings_v1_ledger_layers__layer_id__findings_get
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/cumulative:
    get:
      summary: "Alias for /findings \u2014 baseline enrichment is a client concern"
      operationId: get_cumulative_v1_ledger_layers__layer_id__cumulative_get
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingsResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/events:
    get:
      summary: Get Layer Events
      operationId: get_layer_events_v1_ledger_layers__layer_id__events_get
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      - name: finding_ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter to a specific finding
          title: Finding Ref
        description: Filter to a specific finding
      - name: source_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter by source type
          title: Source Type
        description: Filter by source type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Max events per page
          default: 100
          title: Limit
        description: Max events per page
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Events to skip before returning results
          default: 0
          title: Offset
        description: Events to skip before returning results
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/findings:
    get:
      summary: Get All Findings
      operationId: get_all_findings_v1_ledger_findings_get
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Resume after this layer_id
          title: Cursor
        description: Resume after this layer_id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Max layers per page
          default: 100
          title: Limit
        description: Max layers per page
      - name: since_epoch
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: Only layers with merkle_epoch >= this value
          title: Since Epoch
        description: Only layers with merkle_epoch >= this value
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkFindingsResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/submit:
    post:
      summary: Post Submit
      operationId: post_submit_v1_ledger_layers__layer_id__submit_post
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchSubmitRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation error or identity rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /v1/ledger/fingerprint:
    post:
      summary: Post Fingerprint
      operationId: post_fingerprint_v1_ledger_fingerprint_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FingerprintRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FingerprintResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers:
    get:
      summary: List Layers
      operationId: list_layers_v1_ledger_layers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerListResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /v1/ledger/layers/{layer_id}/sign:
    post:
      summary: Sign Layer Endpoint
      operationId: sign_layer_endpoint_v1_ledger_layers__layer_id__sign_post
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      - name: rekor
        in: query
        required: false
        schema:
          type: boolean
          description: Upload signature to transparency log
          default: false
          title: Rekor
        description: Upload signature to transparency log
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response Sign Layer Endpoint V1 Ledger Layers  Layer Id  Sign
                  Post
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '500':
          description: Signing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/layers/{layer_id}/stamp:
    post:
      summary: Stamp Layer Endpoint
      operationId: stamp_layer_endpoint_v1_ledger_layers__layer_id__stamp_post
      parameters:
      - name: layer_id
        in: path
        required: true
        schema:
          type: string
          title: Layer Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StampRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StampResponse'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: Layer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '500':
          description: Signing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/ledger/whoami:
    get:
      summary: Return the token-verified actor for the caller
      operationId: whoami_endpoint_v1_ledger_whoami_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayerActor'
        '401':
          description: Missing or invalid authentication credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
components:
  schemas:
    Assurance:
      type: string
      enum:
      - execution_proven
      - human_reviewed
      - machine_verified
      - claimed
      title: Assurance
    BatchSubmitRequest:
      properties:
        source_ref:
          type: string
          title: Source Ref
        recorded_at:
          type: string
          title: Recorded At
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Events
          default: []
        needs_review:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Needs Review
          default: []
      type: object
      required:
      - source_ref
      - recorded_at
      title: BatchSubmitRequest
    BulkFindingsResponse:
      properties:
        layers:
          items:
            $ref: '#/components/schemas/LayerFindings'
          type: array
          title: Layers
        total_findings:
          type: integer
          title: Total Findings
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
      - layers
      - total_findings
      title: BulkFindingsResponse
    Disposition:
      properties:
        validity:
          $ref: '#/components/schemas/Validity'
        resolution:
          $ref: '#/components/schemas/DispositionResolution'
        last_updated:
          type: string
          title: Last Updated
        events:
          items:
            type: string
          type: array
          title: Events
        conflict:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Conflict
        refuted_awaiting_signoff:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Refuted Awaiting Signoff
        assurance:
          anyOf:
          - $ref: '#/components/schemas/Assurance'
          - type: 'null'
        fp_overridden:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fp Overridden
        fp_reassertion_blocked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Fp Reassertion Blocked
        severity_override:
          anyOf:
          - $ref: '#/components/schemas/SeverityOverride'
          - type: 'null'
      type: object
      required:
      - validity
      - resolution
      - last_updated
      title: Disposition
    DispositionResolution:
      type: string
      enum:
      - open
      - fix_in_progress
      - resolved
      - partially_resolved
      - risk_accepted
      - regression_introduced
      title: DispositionResolution
    ErrorDetail:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorDetail
    EventEnvelope:
      properties:
        kind:
          type: string
          title: Kind
        contracts_version:
          type: string
          title: Contracts Version
          default: ''
        event:
          additionalProperties: true
          type: object
          title: Event
      type: object
      required:
      - kind
      - event
      title: EventEnvelope
    EventsResponse:
      properties:
        events:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Events
        total:
          type: integer
          title: Total
        layer_id:
          type: string
          title: Layer Id
      type: object
      required:
      - events
      - total
      - layer_id
      title: EventsResponse
    FindingDisposition:
      properties:
        finding_ref:
          type: string
          title: Finding Ref
        disposition:
          $ref: '#/components/schemas/Disposition'
        event_count:
          type: integer
          title: Event Count
        fingerprint:
          anyOf:
          - type: string
          - type: 'null'
          title: Fingerprint
        orphan:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Orphan
      type: object
      required:
      - finding_ref
      - disposition
      - event_count
      title: FindingDisposition
    FindingsResponse:
      properties:
        findings:
          items:
            $ref: '#/components/schemas/FindingDisposition'
          type: array
          title: Findings
        summary:
          $ref: '#/components/schemas/FindingsSummary'
        ledger_only:
          type: boolean
          title: Ledger Only
          default: true
      type: object
      required:
      - findings
      - summary
      title: FindingsResponse
    FindingsSummary:
      properties:
        by_validity:
          $ref: '#/components/schemas/ValidityCounts'
        by_resolution:
          $ref: '#/components/schemas/ResolutionCounts'
      type: object
      required:
      - by_validity
      - by_resolution
      title: FindingsSummary
    FingerprintRequest:
      properties:
        findings:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Findings
        repository:
          anyOf:
          - type: string
          - type: 'null'
          title: Repository
      type: object
      required:
      - findings
      title: FingerprintRequest
    FingerprintResponse:
      properties:
        findings:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Findings
        stamped_count:
          type: integer
          title: Stamped Count
      type: object
      required:
      - findings
      - stamped_count
      title: FingerprintResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
      type: object
      required:
      - status
      title: HealthResponse
    LayerActor:
      properties:
        kind:
          type: string
          title: Kind
        identity:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity
        ldap_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Ldap Verified
        identity_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Identity Verified
        identity_provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Provider
        identity_issuer:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Issuer
        identity_subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Identity Subject
        employee_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Employee Status
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
      type: object
      required:
      - kind
      title: LayerActor
    LayerFindings:
      properties:
        layer_id:
          type: string
          title: Layer Id
        merkle_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Merkle Root
        merkle_epoch:
          anyOf:
          - type: integer
          - type: 'null'
          title: Merkle Epoch
        findings:
          items:
            $ref: '#/components/schemas/FindingDisposition'
          type: array
          title: Findings
        summary:
          $ref: '#/components/schemas/FindingsSummary'
        ledger_only:
          type: boolean
          title: Ledger Only
          default: true
      type: object
      required:
      - layer_id
      - findings
      - summary
      title: LayerFindings
    LayerListResponse:
      properties:
        layers:
          items:
            type: string
          type: array
          title: Layers
      type: object
      required:
      - layers
      title: LayerListResponse
    ResolutionCounts:
      properties:
        open:
          type: integer
          title: Open
          default: 0
        fix_in_progress:
          type: integer
          title: Fix In Progress
          default: 0
        resolved:
          type: integer
          title: Resolved
          default: 0
        partially_resolved:
          type: integer
          title: Partially Resolved
          default: 0
        risk_accepted:
          type: integer
          title: Risk Accepted
          default: 0
        regression_introduced:
          type: integer
          title: Regression Introduced
          default: 0
      type: object
      title: ResolutionCounts
    ResolveRequest:
      properties:
        key:
          type: string
          title: Key
        decision:
          type: string
          title: Decision
        note:
          type: string
          title: Note
          default: ''
      type: object
      required:
      - key
      - decision
      title: ResolveRequest
    ResolveResponse:
      properties:
        resolved:
          type: boolean
          title: Resolved
        key:
          type: string
          title: Key
      type: object
      required:
      - resolved
      - key
      title: ResolveResponse
    Severity:
      type: string
      enum:
      - critical
      - high
      - medium
      - low
      - informational
      title: Severity
    SeverityOverride:
      properties:
        severity:
          $ref: '#/components/schemas/Severity'
        by:
          type: string
          title: By
        at:
          type: string
          title: At
        rationale:
          anyOf:
          - type: string
          - type: 'null'
          title: Rationale
      type: object
      required:
      - severity
      - by
      - at
      title: SeverityOverride
    StampRequest:
      properties:
        fingerprints:
          additionalProperties:
            type: string
          type: object
          title: Fingerprints
      type: object
      required:
      - fingerprints
      title: StampRequest
    StampResponse:
      properties:
        merkle_root:
          anyOf:
          - type: string
          - type: 'null'
          title: Merkle Root
        layer_id:
          type: string
          title: Layer Id
        stamped:
          type: integer
          title: Stamped
      type: object
      required:
      - layer_id
      - stamped
      title: StampResponse
    SubmitResponse:
      properties:
        id:
          type: string
          title: Id
