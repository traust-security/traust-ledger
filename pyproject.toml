[project]
name = "traust-ledger"
version = "0.1.0"
license = "Apache-2.0"
description = "Ledger integrity primitives: canonical event bytes, Merkle trees, signing and verification"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traust_ledger"]

[tool.hatch.build.targets.sdist]
exclude = ["/.ci-venv", "/.venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "pytest-xdist>=3",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"


[tool.coverage.run]
source = ["traust_ledger"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
show_contexts = true

[tool.ruff.lint]
# Deliberately strict: this is the legible kernel — small, line-by-line reviewed.
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
