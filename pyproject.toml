[project]
name = "traust-ledger"
version = "0.3.4"
license = "Apache-2.0"
description = "Disposition-ledger kernel: finding identity, event math, integrity (Merkle + signing), and the single ledger write path"
requires-python = ">=3.11"
dependencies = [
    # 0.1.1 is the floor: LayerEvent timestamps are IsoTimestamp there, which is
    # what lets the read paths here drop their own parse guards.
    "traust-contracts>=0.9.0",
    "jsonschema>=4.0",
    # Authentication is on the path of every write (LedgerClient -> Authenticator
    # -> verifier), so the JWT library is not optional. It sat in the `cli` and
    # `service` extras until 0.17.2, which made `traust-ledger` alone unable to
    # append an event: ModuleNotFoundError: No module named 'jwt'.
    # httpx2 stays optional (`cli`) — only OIDC *network* calls need it, and
    # those import it lazily via traust_ledger.auth._httpx.
    "PyJWT[crypto]>=2.8",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
]
cli = ["httpx2"]

[project.scripts]
ledger = "traust_ledger.cli.main:main"

[tool.uv.sources]
traust-contracts = { git = "https://github.com/traust-security/traust-contracts.git", tag = "v0.9.0" }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traust_ledger"]

[tool.hatch.build.targets.sdist]
exclude = ["/.ci-venv", "/.venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "httpx2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "pytest-httpserver>=1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
markers = ["integration: requires Docker services (mockserver)"]

[tool.coverage.run]
source = ["traust_ledger"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
show_contexts = true

[tool.ruff.lint]
# Deliberately strict: this is the legible kernel — small, line-by-line reviewed.
select = [
    "E",
    "W",   # pycodestyle
    "F",   # pyflakes
    "I",   # import sorting
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
